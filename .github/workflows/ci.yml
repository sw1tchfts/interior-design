name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Pinned: Playwright 1.56.1 has no Chromium build for Ubuntu 26.04, which ubuntu-latest moves to in late 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Installs the Chromium build that matches the pinned @playwright/test version.
      - run: npx playwright install --with-deps chromium
      # Typecheck, lint, unit tests, build, end-to-end tests.
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
